name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Resolve and print what would publish, without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm size

      # npm reads credentials from .npmrc, NOT from NODE_AUTH_TOKEN. That
      # variable only works because actions/setup-node writes an .npmrc
      # pointing at it — and this workflow uses mise, not setup-node. Without
      # this step every publish below fails with ENEEDAUTH.
      #
      # Runs on dry runs too, so a dry run actually proves the credential
      # works instead of only proving the loop logic does.
      - name: Authenticate to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          echo "authenticated as $(npm whoami)"

      # 0.1.0 shipped `workspace:^0.1.0` to consumers and was uninstallable
      # with npm and yarn. Packing is deterministic and cheap, so assert on the
      # packed manifest rather than trusting that the publisher rewrites it.
      - name: "Verify no workspace: protocol survives packing"
        run: |
          set -euo pipefail
          fail=0
          for dir in packages/*/; do
            private=$(node -p "require('./$dir/package.json').private || false")
            [ "$private" = "true" ] && continue
            name=$(node -p "require('./$dir/package.json').name")
            tgz=$(cd "$dir" && pnpm pack --silent 2>/dev/null | tail -1)
            manifest=$(cd "$dir" && tar -xzOf "$tgz" package/package.json)
            if echo "$manifest" | grep -q 'workspace:'; then
              echo "::error::$name would publish a workspace: specifier"
              echo "$manifest" | grep -n 'workspace:' || true
              fail=1
            fi
            (cd "$dir" && rm -f "$tgz")
          done
          [ "$fail" = "0" ] || exit 1
          echo "all packed manifests clean"

      - name: Publish changed packages
        env:
          DRY: ${{ inputs.dry-run }}
          # Provenance requires a PUBLIC repository whose URL matches the
          # package's own repository field. mote is deliberately private, so
          # passing --provenance today fails the publish outright. This flips
          # itself on the day the repo goes public — no edit needed.
          PROVENANCE: ${{ github.event.repository.visibility == 'public' && '--provenance' || '' }}
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            private=$(node -p "require('./$dir/package.json').private || false")
            [ "$private" = "true" ] && continue

            # A published version is final — never republish. CI skipping here
            # is the backstop for the rule in CONTRIBUTING.md.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version — already published"
              continue
            fi

            if [ "$DRY" = "true" ]; then
              echo "would publish $name@$version"
            else
              echo "publishing $name@$version"
              # pnpm publish, NOT npm publish. pnpm rewrites the
              # `workspace:^x.y.z` protocol in dependencies into real version
              # ranges as it packs. npm has no idea what `workspace:` means and
              # ships it verbatim, which is what broke 0.1.0: consumers got
              # `"@usemote/core": "workspace:^0.1.0"` and npm/yarn refused it
              # with EUNSUPPORTEDPROTOCOL. pnpm is the only publisher that can
              # correctly pack this repo.
              (cd "$dir" && pnpm publish --no-git-checks $PROVENANCE --access public)
            fi
          done
